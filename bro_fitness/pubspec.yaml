version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.3
  file_picker: ^8.1.3
  intl: ^0.20.1
  uuid: ^4.5.1
  archive: ^3.6.1
  image: ^4.2.0
  timezone: ^0.10.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
