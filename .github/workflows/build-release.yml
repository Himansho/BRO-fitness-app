name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: bro_fitness
        run: flutter pub get

      - name: Build Debug APK (faster, no signing issues)
        working-directory: bro_fitness
        run: flutter build apk --debug

      - name: Rename APK
        run: cp bro_fitness/build/app/outputs/flutter-apk/app-debug.apk BROFitness-Android.apk

      - name: Show APK info
        run: |
          ls -lh BROFitness-Android.apk
          echo "✅ APK built successfully!"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROFitness-Android-v1.0.${{ github.run_number }}
          path: BROFitness-Android.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🏋️ BRO Fitness v1.0.${{ github.run_number }}"
          body: |
            ## 🏋️ BRO Fitness — Ultra-Private Offline Fitness Journal

            ### ⬇️ Download & Install
            1. Tap **`BROFitness-Android.apk`** below ↓
            2. On phone: **Settings → Security → Allow Unknown Sources**
            3. Open the APK → tap **Install** → done! 🚀

            ### Features
            - 🍽️ 70+ Indian & international foods with macros
            - 🏋️ Sets/reps/weight logging + live 1RM calculator
            - 🏆 Auto PR detection + workout streaks
            - ⏱️ Rest timer (60/90/120/180s)
            - 📸 Progress photos + before/after compare
            - 📄 Weekly PDF reports
            - 💾 ZIP backup & restore
            - 🔒 100% offline — no cloud, no tracking

            Build #${{ github.run_number }} | Min Android 5.0
          files: BROFitness-Android.apk
          make_latest: true
        continue-on-error: true
