name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraFitness-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Xcode App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/ios

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Xcode Project
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      - name: Zip iOS Xcode Project
        run: |
          zip -r iOS-Xcode-Project.zip ios/App

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraFitness-iOS-Xcode-Project
          path: iOS-Xcode-Project.zip

  create-release:
    name: Publish Mobile Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: AuraFitness-Android-APK
          path: ./artifacts/android

      - name: Download iOS Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: AuraFitness-iOS-Xcode-Project
          path: ./artifacts/ios

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp artifacts/android/app-debug.apk release-assets/AuraFitness-Android.apk
          cp artifacts/ios/iOS-Xcode-Project.zip release-assets/AuraFitness-iOS-Xcode-Project.zip

      - name: Create or Update Tag and Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: latest
          name: "Aura Fitness Latest Build"
          body: "This release contains the automatically compiled Android APK and iOS Xcode Project from the latest main branch commit."
          artifacts: "release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}

